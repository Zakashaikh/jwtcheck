[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jwtcheck"
version = "1.0.0"
description = "JWT security analyser — static analysis and token assessment"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shaikh Zaka ur Rehman" }]
dependencies = ["PyJWT>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
jwtcheck = "jwtcheck.cli:main"

[tool.setuptools.packages.find]
include = ["jwtcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
